# 本机物理内存仅 8GB（2026-10-09 定位）：Gradle 堆给到 4G 会挤爆物理内存、
# 迫使内核大量换页到 swap，实测构建从 2 分多劣化到 10 分多（与代码改动量无关）。
# 压到 2G 并单独限制 Kotlin 守护进程。若出现 OutOfMemoryError，把 2G 调回 3G。
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m
# Kotlin 编译守护进程独立限内存（默认会再占 1~2G，小内存机器的隐形大户）
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# Jetifier 会对所有依赖做字节码重写，是 release 构建的固定开销。
# 本项目依赖已全部为 AndroidX，无需 Jetifier（若引入旧 support 库导致构建失败，
# 把下面这行改回 true 即可）。
android.enableJetifier=false
# 复用 Gradle 构建缓存与并行任务，缩短重复构建时间
org.gradle.caching=true
org.gradle.parallel=true
